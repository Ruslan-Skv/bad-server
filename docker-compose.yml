services:
  frontend:
    build:
      context: frontend
    env_file:
      - frontend/.env
    volumes:
      - frontend:/app/frontend/dist
    networks:
      - internal

  mongo:
    image: mongo
    restart: always
    container_name: mongodb
    # env_file:
    #   - ./.env
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: example
    volumes:
      - db:/data/db
      # Монтируем скрипты инициализации
      # - ./mongo-init/init.js:/docker-entrypoint-initdb.d/init.js:ro
      - ./mongo-init/import-data.sh:/docker-entrypoint-initdb.d/import-data.sh:ro
      # Монтируем файлы данных
      - ./.dump/weblarek.users.json:/tmp/weblarek.users.json:ro
      - ./.dump/weblarek.products.json:/tmp/weblarek.products.json:ro
    ports:
      - 27017:27017
    networks:
      - internal

  backend:
    restart: unless-stopped
    build:
      context: backend
    env_file:
      - backend/.env
    volumes:
      - ./backend/src:/app/src
      - public:/app/src/public
    ports:
      - 3000:3000
    networks:
      - internal
    depends_on:
      - mongo
        # Ждем пока MongoDB будет готова
    # healthcheck:
    #   test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
    #   interval: 30s
    #   timeout: 10s
    #   retries: 5
    #   start_period: 40s

  server:
    build:
      context: nginx
    ports:
      - 80:80
    volumes:
      - frontend:/var/app
      - public:/var/public
    depends_on:
      - frontend
      - backend
    networks:
      - internal
    restart: unless-stopped

volumes:
  frontend:
  public:
  db:

networks:
  internal:
